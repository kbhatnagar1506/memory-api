name: ci

on:
  push: {branches: [main]}
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        # The conformance suite runs against a real pgvector instance here; it
        # skips locally, so CI is where the Postgres backend is actually proven.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supermemory
          POSTGRES_PASSWORD: supermemory
          POSTGRES_DB: supermemory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supermemory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Test
        env:
          SUPERMEMORY_TEST_DATABASE_URL: postgresql+asyncpg://supermemory:supermemory@localhost:5432/supermemory_test
        run: pytest --cov=supermemory --cov-report=term-missing --cov-report=xml
      - name: Enforce coverage floor
        run: coverage report --fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t supermemory:ci .
      - name: Boot and probe
        run: |
          docker run -d --name sm -p 8000:8000 \
            -e SUPERMEMORY_STORE_BACKEND=memory supermemory:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs sm && exit 1
