name: mapi

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mapi
      POSTGRES_PASSWORD: mapi
      POSTGRES_DB: mapi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # The API must not start against a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U mapi -d mapi"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      MAPI_ENVIRONMENT: local
      MAPI_STORE_BACKEND: postgres
      MAPI_DATABASE_URL: postgresql+asyncpg://mapi:mapi@db:5432/mapi
      MAPI_REDIS_URL: redis://redis:6379/0
      MAPI_EMBEDDING_BACKEND: ${MAPI_EMBEDDING_BACKEND:-deterministic}
      MAPI_EMBEDDING_DIMENSIONS: 768
      MAPI_RERANK_BACKEND: ${MAPI_RERANK_BACKEND:-heuristic}
      MAPI_LOG_JSON: "true"
      # Development convenience: seeds an org, a space and this admin key.
      MAPI_BOOTSTRAP_ADMIN_KEY: sm_local_dev_key_do_not_use_in_prod
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  pgdata:
