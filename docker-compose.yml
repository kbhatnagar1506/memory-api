name: supermemory

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: supermemory
      POSTGRES_PASSWORD: supermemory
      POSTGRES_DB: supermemory
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # The API must not start against a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U supermemory -d supermemory"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      SUPERMEMORY_ENVIRONMENT: local
      SUPERMEMORY_STORE_BACKEND: postgres
      SUPERMEMORY_DATABASE_URL: postgresql+asyncpg://supermemory:supermemory@db:5432/supermemory
      SUPERMEMORY_REDIS_URL: redis://redis:6379/0
      SUPERMEMORY_EMBEDDING_BACKEND: ${SUPERMEMORY_EMBEDDING_BACKEND:-deterministic}
      SUPERMEMORY_EMBEDDING_DIMENSIONS: 768
      SUPERMEMORY_RERANK_BACKEND: ${SUPERMEMORY_RERANK_BACKEND:-heuristic}
      SUPERMEMORY_LOG_JSON: "true"
      # Development convenience: seeds an org, a space and this admin key.
      SUPERMEMORY_BOOTSTRAP_ADMIN_KEY: sm_local_dev_key_do_not_use_in_prod
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  pgdata:
