[project]
name = "mapi"
version = "0.1.0"
description = "A production-grade memory API for AI agents: hybrid retrieval, belief revision, and LLM reranking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna Bhatnagar" }]

dependencies = [
    "anthropic[vertex]>=0.69",  # cross-family benchmark judge (Claude on Vertex)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "orjson>=3.10",
    "httpx>=0.27",
    "tenacity>=9.0",
    "redis>=5.2",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.55"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
]

[project.scripts]
mapi = "mapi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped async fixtures need a session-scoped loop, or every test
# gets a fresh loop and a pool bound to a closed one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "postgres: requires a live PostgreSQL with pgvector (skipped when absent)",
    "live_llm: calls a real embedding/LLM provider (skipped without credentials)",
]
filterwarnings = ["error::DeprecationWarning:mapi.*"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
packages = ["mapi"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["pgvector.*", "google.*", "redis.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/mapi"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
