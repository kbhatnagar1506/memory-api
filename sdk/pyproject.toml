[project]
name = "mapi-sdk"
version = "0.1.0"
description = "Python client for mapi — memory for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishna Bhatnagar" }]
keywords = ["memory", "agents", "llm", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

# httpx and nothing else. Every additional dependency is a version conflict
# waiting to happen in somebody else's application, and a client that fights
# the host project's pins is a client people vendor around.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8", "mypy>=1.13"]

[project.urls]
Homepage = "https://memory-api-7b178bde9ecc.herokuapp.com"
Documentation = "https://memory-api-7b178bde9ecc.herokuapp.com/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_sdk"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.mypy]
strict = true
