[project]
name = "mapi-sdk"
version = "0.1.1"
description = "Python client for mapi — memory for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishna Bhatnagar" }]
keywords = ["memory", "agents", "llm", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

# httpx and nothing else. Every additional dependency is a version conflict
# waiting to happen in somebody else's application, and a client that fights
# the host project's pins is a client people vendor around.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8", "mypy>=1.13"]

# No [project.urls] for now. The links PyPI renders in the sidebar pointed at
# a Heroku hostname, and a project page advertising an app URL invites people
# to poke at it before it is meant to be poked at. Restore Homepage and
# Documentation when there is a stable domain to point them at -- PyPI reads
# these per release, so the next upload picks up whatever is here.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapi_sdk"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.mypy]
strict = true
